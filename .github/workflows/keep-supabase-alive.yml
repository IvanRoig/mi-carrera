name: Mantener Supabase despierto

# Supabase pausa los proyectos free tras 7 días sin actividad. Esto le pega a
# la base cada 3 días para que nunca llegue a pausarse. Usa los mismos Secrets
# que el deploy.
on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # Un SELECT real (no solo el health check) para que cuente como
          # actividad de la base. Por RLS, con la anon key vuelve vacío: da igual.
          curl --fail-with-body -sS \
            "$SUPABASE_URL/rest/v1/planner_states?select=user_id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
